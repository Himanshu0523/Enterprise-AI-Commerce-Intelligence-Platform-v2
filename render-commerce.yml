# Render Infrastructure-as-Code Blueprint
# Blueprint 2 of 3: Essential Commerce Microservices (4 Services)
# Keeps total active services well under the Render Hobby 25-resource limit.

services:
  # 1. User & Profile Service
  - type: web
    name: user-service
    runtime: node
    rootDir: services/core/user-service
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

  # 2. Shopping Cart Service
  - type: web
    name: cart-service
    runtime: node
    rootDir: services/core/cart-service
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

  # 3. Inventory & Stock Service
  - type: web
    name: inventory-service
    runtime: node
    rootDir: services/core/inventory-service
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

  # 4. Payment Gateway Integration Service
  - type: web
    name: payment-service
    runtime: node
    rootDir: services/core/payment-service
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
