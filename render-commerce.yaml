# Render Infrastructure-as-Code Blueprint
# Modular Blueprint: Core Commerce & User Microservices

services:
  - type: web
    name: user-service
    runtime: node
    rootDir: services/core/user-service
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: PORT
        value: 3002

  - type: web
    name: inventory-service
    runtime: node
    rootDir: services/core/inventory-service
    buildCommand: npm install
