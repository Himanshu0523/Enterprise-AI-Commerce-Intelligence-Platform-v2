# Render Infrastructure-as-Code Blueprint
# Modular Blueprint: Python AI & Intelligence Microservices

services:
  - type: web
    name: ml-service
    runtime: python
    rootDir: services/intelligence/ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free

  - type: web
    name: pricing-service
