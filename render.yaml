# Render Infrastructure-as-Code Blueprint
# Deploy all 20 microservices (API Gateway + Core Node Microservices + Python AI Services)

services:
  # ---------------------------------------------------------------------------
  # 1. API Gateway
  # ---------------------------------------------------------------------------
  - type: web
    name: api-gateway
    runtime: node
    rootDir: services/api-gateway
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: PORT
        value: 8000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false

  # ---------------------------------------------------------------------------
  # 2. Core Node Microservices
  # ---------------------------------------------------------------------------
  - type: web
    name: auth-service
    runtime: node
    rootDir: services/core/auth-service
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: PORT
        value: 3001

