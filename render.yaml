  # ---------------------------------------------------------------------------
  # 3. Python AI & Intelligence Microservices (FastAPI)
  # ---------------------------------------------------------------------------
  - type: web
    name: ml-service
    runtime: python
    rootDir: services/intelligence/ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
