# Render Infrastructure-as-Code Blueprint
# Essential Microservices Blueprint (Top 5 Core Services)

services:
  # ---------------------------------------------------------------------------
  # 1. API Gateway
  # ---------------------------------------------------------------------------
  - type: web
    name: api-gateway
    runtime: node
    rootDir: services/api-gateway
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: PORT
        value: 8000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false

  - type: web
    name: auth-service
    runtime: node
    rootDir: services/core/auth-service
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: PORT
        value: 3001

  - type: web
    name: product-service
    runtime: node
    rootDir: services/core/product-service
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: PORT
        value: 3003

  - type: web
    name: order-service
    runtime: node
    rootDir: services/core/order-service
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: PORT
        value: 3006

  # ---------------------------------------------------------------------------
  # 3. Python AI Operations Service
  # ---------------------------------------------------------------------------
  - type: web
    name: agent-service
    runtime: python
    rootDir: services/operations/agent-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
