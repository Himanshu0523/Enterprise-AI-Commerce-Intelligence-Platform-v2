  # 4. FRONTEND & CLIENT WEB APPLICATIONS (2 Next.js Web Apps)

  # 4.1 Commerce Storefront Web App
  - type: web
    name: storefront
    runtime: node
    rootDir: apps/storefront
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: api-gateway
          property: url

  # 4.2 Admin & Merchant Intelligence Dashboard
