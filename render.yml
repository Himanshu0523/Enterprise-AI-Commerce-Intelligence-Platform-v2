# =============================================================================
# Render Unified Infrastructure-as-Code Blueprint
# Platform: Enterprise AI-Powered Autonomous Commerce Platform v2
# Total Microservices: 20 (Compliant with Render Hobby 25-Resource Limit)
# =============================================================================

services:
  # ===========================================================================
  # 1. API GATEWAY & EDGE PROXY
  # ===========================================================================
  - type: web
    name: api-gateway
    runtime: node
    rootDir: services/api-gateway
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false

  # ===========================================================================
  # 2. CORE COMMERCE & USER MICROSERVICES (12 Node.js Services)
  # ===========================================================================

  # 2.1 Authentication & RBAC Service
  - type: web
    name: auth-service
    runtime: node
    rootDir: services/core/auth-service
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

