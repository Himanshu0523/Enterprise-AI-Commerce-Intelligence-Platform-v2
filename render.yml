  # 3.1 Autonomous AI Agent Supervisor
  - type: web
    name: agent-service
    runtime: python
    rootDir: services/operations/agent-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
