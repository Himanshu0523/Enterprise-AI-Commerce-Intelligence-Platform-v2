# Render Infrastructure-as-Code Blueprint
# Blueprint 1 of 3: Core Platform Services & Gateway (5 Services)

services:
  # 1. API Gateway
  - type: web
    name: api-gateway
    runtime: node
    rootDir: services/api-gateway
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false

  # 2. Auth Service
  - type: web
    name: auth-service
    runtime: node
    rootDir: services/core/auth-service
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

  # 3. Product Catalog Service
  - type: web
    name: product-service
    runtime: node
    rootDir: services/core/product-service
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

  # 4. Order Management Service
  - type: web
    name: order-service
    runtime: node
    rootDir: services/core/order-service
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

  # 5. AI Agent Supervisor Service
  - type: web
    name: agent-service
    runtime: python
    rootDir: services/operations/agent-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
