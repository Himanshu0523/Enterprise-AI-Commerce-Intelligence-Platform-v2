  # ===========================================================================
  # 3. AI, INTELLIGENCE & AGENTIC MICROSERVICES (7 Python Services)
  # ===========================================================================

  # 3.1 Autonomous AI Agent Supervisor
  - type: web
    name: agent-service
    runtime: python
    rootDir: services/operations/agent-service
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port ${PORT:-8080}
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # 3.2 Retrieval-Augmented Generation (RAG) Support Service
