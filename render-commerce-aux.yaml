# Render Infrastructure-as-Code Blueprint
# Optional Auxiliary Commerce Microservices (5 Services)
# Deploy this blueprint if you need shipping, coupons, reviews, notifications, and audit logging.

services:
  # 1. Shipping & Logistics Service
  - type: web
    name: shipping-service
    runtime: node
    rootDir: services/core/shipping-service
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

  # 2. Coupon & Promotions Service
  - type: web
    name: coupon-service
    runtime: node
    rootDir: services/core/coupon-service
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

  # 3. Customer Reviews Service
  - type: web
    name: review-service
    runtime: node
    rootDir: services/core/review-service
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

  # 4. Multi-Channel Notification Service
  - type: web
    name: notification-service
    runtime: node
    rootDir: services/core/notification-service
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

  # 5. Tamper-Evident Audit Log Service
  - type: web
    name: audit-log-service
    runtime: node
    rootDir: services/core/audit-log-service
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
